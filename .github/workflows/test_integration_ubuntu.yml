name: Integration Tests (Ubuntu)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  FDS:
    runs-on: ubuntu-latest
    container:
      image: openbcl/fds:6.9.1
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        run: python3 -m pip install poetry

      - name: Run serial tests
        timeout-minutes: 30
        run: |
          apt-get update && apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
          export SIMVUE_URL=${{ secrets.SIMVUE_URL }}
          export SIMVUE_TOKEN=${{ secrets.SIMVUE_TOKEN }}
          python -m poetry run pytest -k serial tests/integration/ -n 4 -v

      - name: Run parallel tests
        timeout-minutes: 30
        run: |
          apt-get update && apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6
          export SIMVUE_URL=${{ secrets.SIMVUE_URL }}
          export SIMVUE_TOKEN=${{ secrets.SIMVUE_TOKEN }}
          python -m poetry run pytest -k parallel tests/integration/ -v
